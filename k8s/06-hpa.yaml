# HorizontalPodAutoscaler — autoscale berdasarkan CPU dan memory
#
# Prasyarat — metrics-server harus terinstall (lihat backend-ict/k8s/06-hpa.yaml
# untuk cara cek/install kalau belum ada).

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-siaptes-hpa
  namespace: backend-siaptes
  labels:
    app.kubernetes.io/name: backend-siaptes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-siaptes
  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
